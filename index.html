<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<title>Полутон</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
/* ───────── Основа: цвет, типографика, сетка ───────── */
:root{
  color-scheme:dark;
  --bg:#000; --s1:#0b0b0b; --s2:#141414; --s3:#1d1d1d; --s4:#292929;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.15);
  --fg:#f7f7f7; --fg2:rgba(255,255,255,.62); --fg3:rgba(255,255,255,.38);
  --inv:#fff; --inv-fg:#000;
  --glass:rgba(18,18,18,.68); --glass2:rgba(255,255,255,.07);
  --pill:rgba(255,255,255,.11);
  --sh-s:0 1px 2px rgba(0,0,0,.5),0 8px 22px -8px rgba(0,0,0,.6);
  --sh-l:0 36px 90px -24px rgba(0,0,0,.9),0 10px 30px -10px rgba(0,0,0,.7);
  --r-s:12px; --r-m:18px; --r-l:26px; --r-xl:34px;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.32,1.42,.5,1);
  --font:"Inter","SF Pro Text",-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  --display:"SF Pro Display","Inter Display",-apple-system,"Segoe UI Variable Display","Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono","Roboto Mono",Consolas,monospace;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --side:268px; --gap:18px; --pad:28px; --tabh:0px; --minih:0px;
}
html[data-theme=light]{
  color-scheme:light;
  --bg:#f0f0f0; --s1:#fff; --s2:#f7f7f7; --s3:#ececec; --s4:#dedede;
  --line:rgba(0,0,0,.08); --line2:rgba(0,0,0,.16);
  --fg:#0a0a0a; --fg2:rgba(0,0,0,.6); --fg3:rgba(0,0,0,.4);
  --inv:#0a0a0a; --inv-fg:#fff;
  --glass:rgba(255,255,255,.72); --glass2:rgba(0,0,0,.05);
  --pill:rgba(0,0,0,.08);
  --sh-s:0 1px 2px rgba(0,0,0,.06),0 8px 22px -10px rgba(0,0,0,.18);
  --sh-l:0 36px 90px -30px rgba(0,0,0,.35),0 10px 30px -12px rgba(0,0,0,.18);
}
/* Кинозал и плеер всегда тёмные, какая бы тема ни стояла */
.dark{
  color-scheme:dark;
  --bg:#000; --s1:#0b0b0b; --s2:#141414; --s3:#1d1d1d; --s4:#292929; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.15);
  --fg:#f7f7f7; --fg2:rgba(255,255,255,.62); --fg3:rgba(255,255,255,.38); --inv:#fff; --inv-fg:#000;
  --glass:rgba(18,18,18,.68); --glass2:rgba(255,255,255,.07); --pill:rgba(255,255,255,.11);
  --sh-s:0 1px 2px rgba(0,0,0,.5),0 8px 22px -8px rgba(0,0,0,.6); --sh-l:0 36px 90px -24px rgba(0,0,0,.9),0 10px 30px -10px rgba(0,0,0,.7);
  color:var(--fg);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{font:400 15px/1.45 var(--font);color:var(--fg);background:var(--bg);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11";transition:background-color .4s var(--ease),color .4s var(--ease)}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
a{color:inherit}
img{display:block;max-width:100%}
[hidden]{display:none!important}
::selection{background:var(--fg);color:var(--bg)}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:3px solid transparent;background-clip:content-box}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.035em;font-weight:700;line-height:1.08}
.t-xxl{font:700 clamp(30px,5vw,44px)/1.02 var(--display);letter-spacing:-.045em}
.t-xl{font:700 26px/1.1 var(--display);letter-spacing:-.035em}
.t-l{font:650 18px/1.2 var(--display);letter-spacing:-.02em}
.cap{font:500 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg3)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.dim{color:var(--fg2)} .dim2{color:var(--fg3)}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:18px;height:18px} .ic.l{width:28px;height:28px} .ic.fill{fill:currentColor;stroke:none}
.row{display:flex;align-items:center;gap:10px} .col{display:flex;flex-direction:column} .grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ───────── Кнопки-пилюли, поля ───────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;font-weight:600;font-size:14.5px;letter-spacing:-.01em;background:var(--pill);color:var(--fg);white-space:nowrap;transition:transform .35s var(--spring),background-color .25s var(--ease),opacity .25s,box-shadow .3s var(--ease);user-select:none;-webkit-user-select:none}
.btn:hover{background:var(--line2)} .btn:active{transform:scale(.95)}
.btn.pri{background:var(--inv);color:var(--inv-fg);box-shadow:var(--sh-s)} .btn.pri:hover{background:var(--inv);opacity:.88}
.btn.ghost{background:transparent} .btn.ghost:hover{background:var(--pill)}
.btn.line{background:transparent;box-shadow:inset 0 0 0 1px var(--line2)}
.btn.sm{height:36px;padding:0 15px;font-size:13.5px} .btn.xs{height:30px;padding:0 12px;font-size:12.5px;gap:6px}
.btn.icon{width:44px;padding:0} .btn.icon.sm{width:36px} .btn.icon.xs{width:30px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.busy{pointer-events:none;color:transparent!important;position:relative}
.btn.busy::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;border:2px solid var(--inv-fg);border-top-color:transparent;animation:spin .7s linear infinite}
.btn.busy:not(.pri)::after{border-color:var(--fg);border-top-color:transparent}
.field{display:flex;align-items:center;gap:10px;height:52px;padding:0 18px;border-radius:999px;background:var(--glass2);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .25s var(--ease),background-color .25s}
.field:focus-within{box-shadow:inset 0 0 0 1.5px var(--fg)}
.field input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;font-size:16px}
.field input::placeholder{color:var(--fg3)}
.field .ic{color:var(--fg3)}
.field.err{box-shadow:inset 0 0 0 1.5px var(--fg);animation:shake .4s var(--ease)}
.lbl{display:block;margin:0 0 7px 16px}
.hint{font-size:13px;color:var(--fg2);line-height:1.4}
.errbox{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:var(--r-m);background:var(--glass2);box-shadow:inset 0 0 0 1px var(--line2);font-size:13.5px;line-height:1.4;animation:pop .35s var(--spring)}
.errbox .ic{margin-top:1px}
input[type=range]{-webkit-appearance:none;appearance:none;height:22px;background:none;margin:0;cursor:pointer;--v:50%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--fg) var(--v),var(--line2) var(--v))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--line2)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--fg)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--fg);margin-top:-5px;box-shadow:0 1px 4px rgba(0,0,0,.4);transition:transform .25s var(--spring)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--fg)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.3)}
.switch{position:relative;width:48px;height:28px;border-radius:999px;background:var(--line2);transition:background-color .3s var(--ease);flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--s1);box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .45s var(--spring)}
.dark .switch::after,html[data-theme=dark] .switch::after{background:#fff}
.switch.on{background:var(--inv)} .switch.on::after{transform:translateX(20px);background:var(--inv-fg)}

/* ───────── Движущиеся пилюли ───────── */
.pillbar{position:relative;display:inline-flex;gap:2px;padding:4px;border-radius:999px;background:var(--glass2);box-shadow:inset 0 0 0 1px var(--line);isolation:isolate;max-width:100%}
.pillbar>button{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 15px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--fg2);white-space:nowrap;transition:color .3s var(--ease)}
.pillbar>button.on{color:var(--inv-fg)} .pillbar>button:not(.on):hover{color:var(--fg)}
.pill-ind{position:absolute;z-index:0;left:0;top:0;border-radius:999px;background:var(--inv);box-shadow:var(--sh-s);transition:transform .52s var(--spring),width .52s var(--spring),height .52s var(--spring),opacity .2s;will-change:transform;pointer-events:none}
.pill-ind.raw{transition:none}
.pillbar.soft>button.on{color:var(--fg)} .pillbar.soft .pill-ind{background:var(--pill);box-shadow:none}
.pillbar.fill{display:flex} .pillbar.fill>button{flex:1}

/* ───────── Каркас ───────── */
#app{position:fixed;inset:0;display:grid;grid-template-columns:var(--side) minmax(0,1fr);padding-top:var(--sat)}
#side{display:flex;flex-direction:column;gap:22px;padding:22px 16px calc(16px + var(--sab)) calc(16px + var(--sal));border-right:1px solid var(--line);overflow-y:auto;min-height:0}
.brand{display:flex;align-items:center;gap:11px;padding:6px 10px 2px}
.logo{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--fg);background:linear-gradient(90deg,transparent 50%,var(--fg) 50%);flex:none;transition:transform .9s var(--spring)}
.brand:hover .logo{transform:rotate(180deg)}
.brand b{font:750 21px/1 var(--display);letter-spacing:-.05em}
.nav{position:relative;display:flex;flex-direction:column;gap:2px;isolation:isolate}
.nav>button{position:relative;z-index:1;display:flex;align-items:center;gap:13px;height:46px;padding:0 15px;border-radius:999px;font-weight:600;color:var(--fg2);transition:color .3s var(--ease)}
.nav>button.on{color:var(--inv-fg)} .nav>button:not(.on):hover{color:var(--fg)}
.nav .badge{margin-left:auto}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--pill);font:600 11px/20px var(--mono);text-align:center}
.nav>button.on .badge{background:rgba(127,127,127,.25)}
#side .me{margin-top:auto;display:flex;align-items:center;gap:11px;padding:8px;border-radius:999px;background:var(--glass2);box-shadow:inset 0 0 0 1px var(--line);text-align:left;transition:transform .35s var(--spring)}
#side .me:active{transform:scale(.97)}
#main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
#top{display:flex;align-items:center;gap:12px;padding:20px var(--pad) 10px;min-height:76px;flex:none}
#top h1{font-size:30px}
#top .acts{margin-left:auto;display:flex;align-items:center;gap:8px}
#scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:6px var(--pad) calc(40px + var(--tabh) + var(--minih) + var(--sab));scroll-behavior:smooth}
#view{max-width:1560px;margin:0 auto}
#tab{display:none}
.sec{margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.sec:first-child{margin-top:4px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-bottom:18px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:64px 20px;color:var(--fg2);animation:rise .5s var(--ease) both}
.empty .orb{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--glass2);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:6px;color:var(--fg)}
.empty h3{font-size:20px;color:var(--fg)}
.empty p{margin:0;max-width:380px}

/* ───────── Аватар ───────── */
.ava{position:relative;width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 14px/1 var(--display);background:var(--s3);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line);user-select:none;-webkit-user-select:none}
.ava img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.ava.s{width:28px;height:28px;font-size:11px} .ava.xs{width:22px;height:22px;font-size:9px} .ava.l{width:92px;height:92px;font-size:32px}
.ava .dot{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:var(--fg);box-shadow:0 0 0 2.5px var(--bg);transform:scale(0);transition:transform .45s var(--spring)}
.ava.on .dot{transform:scale(1)}
.ava.talk{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg);animation:talk 1s var(--ease) infinite}
.avas{display:flex} .avas .ava{margin-left:-8px;box-shadow:0 0 0 2px var(--s1)} .avas .ava:first-child{margin-left:0}

/* ───────── «Смотрят сейчас» ───────── */
.live{display:flex;flex-direction:column;gap:8px}
.live-item{display:flex;gap:11px;align-items:center;padding:8px;border-radius:var(--r-m);background:var(--glass2);box-shadow:inset 0 0 0 1px var(--line);text-align:left;width:100%;transition:transform .4s var(--spring),background-color .25s;animation:rise .45s var(--ease) both}
.live-item:hover{background:var(--pill)} .live-item:active{transform:scale(.97)}
.live-item .th{position:relative;width:64px;height:40px;border-radius:10px;overflow:hidden;background:var(--s3);flex:none;display:grid;place-items:center;color:var(--fg3)}
.live-item .th.sq{width:40px}
.live-item .th img{width:100%;height:100%;object-fit:cover}
.live-item .ttl{font-weight:600;font-size:13.5px;line-height:1.2}
.live-item .sub{font-size:11.5px;color:var(--fg2);display:flex;align-items:center;gap:6px;margin-top:3px}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:10px}
.eq i{width:2px;background:currentColor;border-radius:1px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.35s} .eq i:nth-child(3){animation-delay:-.7s}
.eq.off i{animation:none;height:3px}
.live-strip{display:none}

/* ───────── Карточки фильмов ───────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:22px var(--gap)}
.card{position:relative;min-width:0;animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*28ms)}
.card.gone{animation:vanish .3s var(--ease) both}
.card-media{position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:var(--r-l);overflow:hidden;background:var(--s2);box-shadow:inset 0 0 0 1px var(--line);transition:transform .5s var(--spring),box-shadow .4s var(--ease)}
.card-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s var(--ease),transform .7s var(--ease),filter .4s}
.card-media img.in{opacity:1}
.card-media .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--fg3)}
.card.ready .card-media{cursor:pointer}
.card.ready:hover .card-media{transform:translateY(-4px);box-shadow:inset 0 0 0 1px var(--line2),var(--sh-l)}
.card.ready:hover .card-media img{transform:scale(1.04)}
.card.ready .card-media:active{transform:scale(.97)}
.card:not(.ready) .card-media img{filter:brightness(.35) saturate(.6)}
.card-play{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);opacity:0;transform:scale(.7);transition:opacity .3s var(--ease),transform .5s var(--spring)}
.card.ready:hover .card-play{opacity:1;transform:scale(1)}
.tag{position:absolute;display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font:600 10.5px/1 var(--mono);letter-spacing:.02em}
.tag.tl{left:10px;top:10px} .tag.br{right:10px;bottom:10px} .tag.bl{left:10px;bottom:10px}
.tag.livet{background:#fff;color:#000}
.card-st{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:14px;text-align:center;color:#fff}
.card-st .stage{font-weight:600;font-size:13px;line-height:1.25;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.card-st .sub{font:500 11px/1.3 var(--mono);color:rgba(255,255,255,.7)}
.card-st .errt{font-size:12.5px;line-height:1.3;max-height:5.2em;overflow:hidden;color:rgba(255,255,255,.85)}
.ring{width:46px;height:46px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.5}
.ring .bg{stroke:rgba(255,255,255,.18)} .ring .fg{stroke:#fff;stroke-linecap:round;stroke-dasharray:119.4;stroke-dashoffset:119.4;transition:stroke-dashoffset .5s var(--ease)}
.ring.spin{animation:spin 1.1s linear infinite} .ring.spin .fg{stroke-dashoffset:84}
.card-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.14)}
.card-bar i{display:block;height:100%;width:0;background:#fff;transition:width .5s var(--ease)}
.card-body{padding:11px 4px 0;display:flex;gap:8px;align-items:flex-start}
.card-title{font-weight:650;font-size:15px;line-height:1.25;letter-spacing:-.015em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{margin-top:4px;font-size:12px;color:var(--fg2);display:flex;flex-wrap:wrap;gap:3px 8px;align-items:center}
.card-meta .q{font:500 10.5px/1 var(--mono);padding:3px 6px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--line2);color:var(--fg2)}
.card-meta .q.wip{color:var(--fg3);box-shadow:inset 0 0 0 1px var(--line);background:linear-gradient(90deg,var(--pill) var(--p,0%),transparent var(--p,0%))}
.card-more{margin:-4px -6px 0 auto;color:var(--fg3)}
.skel{position:relative;overflow:hidden;background:var(--s2);border-radius:var(--r-l)}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,var(--line2) 50%,transparent 70%);transform:translateX(-100%);animation:shimmer 1.4s var(--ease) infinite}
.skel.line{height:14px;border-radius:7px}

/* ───────── Списки: музыка, друзья ───────── */
.list{display:flex;flex-direction:column;gap:2px}
.item{position:relative;display:flex;align-items:center;gap:13px;padding:8px 10px;border-radius:var(--r-m);transition:background-color .25s var(--ease),transform .4s var(--spring);animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0)*18ms);min-width:0}
.item:hover{background:var(--glass2)}
.item.click{cursor:pointer} .item.click:active{transform:scale(.985)}
.item.cur{background:var(--pill)}
.cover{position:relative;width:48px;height:48px;border-radius:12px;overflow:hidden;background:var(--s3);flex:none;display:grid;place-items:center;color:var(--fg3)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.5);color:#fff;opacity:0;transition:opacity .25s}
.item:hover .cover .ov,.item.cur .cover .ov{opacity:1}
.item .ttl{font-weight:600;line-height:1.25} .item .sub{font-size:12.5px;color:var(--fg2);margin-top:2px}
.item .acts{display:flex;gap:2px;opacity:.0;transition:opacity .2s}
.item:hover .acts,.item:focus-within .acts{opacity:1}
.panel{background:var(--s1);border-radius:var(--r-l);box-shadow:inset 0 0 0 1px var(--line);padding:20px}
html[data-theme=dark] .panel{background:var(--s1)}
.panel+.panel{margin-top:14px}
.panel h3{font-size:17px;margin-bottom:4px}
.setrow{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0}
.meter{height:8px;border-radius:8px;background:var(--pill);overflow:hidden;display:flex}
.meter i{display:block;height:100%;background:var(--fg);transition:width .8s var(--ease)}
.meter i+i{background:var(--fg3)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:14px;align-items:start}
.cols .panel+.panel{margin-top:0}

/* ───────── Листы (снизу на телефоне, по центру на компьютере), меню, тосты ───────── */
#sheets{position:fixed;inset:0;z-index:800;pointer-events:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity .35s var(--ease);pointer-events:auto}
.sheet-bg.in{opacity:1}
.sheet{position:absolute;left:50%;top:50%;width:min(540px,calc(100% - 32px));max-height:min(86vh,820px);display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(34px) saturate(1.5);-webkit-backdrop-filter:blur(34px) saturate(1.5);border-radius:var(--r-xl);box-shadow:inset 0 0 0 1px var(--line2),var(--sh-l);pointer-events:auto;opacity:0;transform:translate(-50%,-46%) scale(.94);transition:opacity .3s var(--ease),transform .5s var(--spring)}
.sheet.in{opacity:1;transform:translate(-50%,-50%) scale(1)}
.sheet.wide{width:min(700px,calc(100% - 32px))}
.sheet-h{display:flex;align-items:center;gap:10px;padding:20px 20px 6px 24px;flex:none}
.sheet-h h2{font-size:21px;flex:1}
.sheet-b{padding:12px 24px 24px;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:14px}
.grab{display:none}
.menu{position:fixed;z-index:850;min-width:200px;padding:6px;border-radius:20px;background:var(--glass);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);box-shadow:inset 0 0 0 1px var(--line2),var(--sh-l);opacity:0;transform:scale(.9);transform-origin:var(--ox,100%) var(--oy,0%);transition:opacity .2s var(--ease),transform .4s var(--spring)}
.menu.in{opacity:1;transform:none}
.menu button{display:flex;align-items:center;gap:11px;width:100%;height:42px;padding:0 14px;border-radius:14px;font-weight:550;font-size:14px;text-align:left;transition:background-color .2s}
.menu button:hover{background:var(--pill)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 8px}
#toasts{position:fixed;z-index:950;left:50%;top:calc(14px + var(--sat));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:min(460px,calc(100% - 24px));pointer-events:none}
.toast{display:flex;align-items:center;gap:11px;max-width:100%;padding:10px 16px 10px 12px;min-height:46px;border-radius:999px;background:var(--glass);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);box-shadow:inset 0 0 0 1px var(--line2),var(--sh-l);font-size:13.5px;font-weight:550;line-height:1.3;pointer-events:auto;animation:toastIn .5s var(--spring) both}
.toast.out{animation:toastOut .3s var(--ease) both}
.toast.big{border-radius:24px;padding:12px 12px 12px 14px}
.toast .btn{flex:none}
#drop{position:fixed;inset:0;z-index:900;display:grid;place-items:center;background:rgba(0,0,0,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
#drop.on{opacity:1}
#drop .box{display:flex;flex-direction:column;align-items:center;gap:14px;padding:44px 60px;border-radius:var(--r-xl);border:2px dashed rgba(255,255,255,.5);transform:scale(.92);transition:transform .5s var(--spring)}
#drop.on .box{transform:none}

/* ───────── Вход ───────── */
#gate{position:fixed;inset:0;z-index:700;display:grid;place-items:center;padding:calc(20px + var(--sat)) 20px calc(20px + var(--sab));overflow-y:auto;background:var(--bg)}
#gate::before{content:"";position:fixed;inset:-20%;background:radial-gradient(60% 50% at 30% 20%,var(--line2),transparent 60%),radial-gradient(50% 50% at 80% 90%,var(--line),transparent 60%);animation:drift 26s ease-in-out infinite alternate;pointer-events:none}
.gate-card{position:relative;width:min(420px,100%);display:flex;flex-direction:column;gap:14px;animation:rise .6s var(--ease) both}
.gate-card .logo{width:54px;height:54px;box-shadow:inset 0 0 0 3px var(--fg);margin-bottom:8px}
.gate-card form{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.gate-foot{margin-top:6px;text-align:center}
#splash{position:fixed;inset:0;z-index:990;display:grid;place-items:center;background:var(--bg);transition:opacity .5s var(--ease),visibility .5s}
#splash.out{opacity:0;visibility:hidden}
#splash .logo{width:60px;height:60px;box-shadow:inset 0 0 0 3px var(--fg);animation:spin 2.4s var(--ease) infinite}

/* ───────── Плеер ───────── */
.player{position:relative;width:100%;height:100%;background:#000;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;container-type:inline-size}
.player video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;transition:transform .35s var(--ease)}
.player video::cue{background:rgba(0,0,0,.6);color:#fff;font:500 1em var(--font)}
.p-tap{position:absolute;inset:0}
.p-shade{position:absolute;left:0;right:0;pointer-events:none;transition:opacity .45s var(--ease)}
.p-shade.t{top:0;height:130px;background:linear-gradient(rgba(0,0,0,.72),transparent)}
.p-shade.b{bottom:0;height:190px;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.p-top,.p-bot{position:absolute;left:0;right:0;display:flex;align-items:center;gap:6px;transition:opacity .45s var(--ease),transform .45s var(--ease);color:#fff}
.p-top{top:0;padding:14px calc(14px + var(--sar)) 0 calc(14px + var(--sal));gap:10px}
.p-top .ttl{font:650 16px/1.2 var(--display);letter-spacing:-.02em;text-shadow:0 1px 10px rgba(0,0,0,.6)}
.p-top .sub{font-size:12px;color:rgba(255,255,255,.7)}
.p-bot{bottom:0;flex-direction:column;align-items:stretch;gap:2px;padding:0 calc(14px + var(--sar)) 10px calc(14px + var(--sal))}
.player.idle .p-top{opacity:0;transform:translateY(-10px);pointer-events:none}
.player.idle .p-bot{opacity:0;transform:translateY(12px);pointer-events:none}
.player.idle .p-shade{opacity:0}
.player.idle{cursor:none}
.p-row{display:flex;align-items:center;gap:2px}
.pb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;transition:background-color .2s,transform .35s var(--spring);flex:none}
.pb:hover{background:rgba(255,255,255,.14)} .pb:active{transform:scale(.88)}
.pb.on{background:#fff;color:#000}
.p-time{font:500 12.5px/1 var(--mono);font-variant-numeric:tabular-nums;color:rgba(255,255,255,.85);padding:0 8px;white-space:nowrap}
.p-vol{display:flex;align-items:center}
.p-vol input{width:0;opacity:0;transition:width .4s var(--ease),opacity .3s;--v:100%}
.p-vol:hover input,.p-vol input:focus-visible{width:84px;opacity:1;margin-right:8px}
.p-vol input::-webkit-slider-runnable-track{background:linear-gradient(to right,#fff var(--v),rgba(255,255,255,.28) var(--v))}
.seek{position:relative;height:26px;cursor:pointer;touch-action:none}
.seek .tr{position:absolute;left:0;right:0;top:11px;height:4px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden;transition:transform .3s var(--ease)}
.seek:hover .tr,.seek.drag .tr{transform:scaleY(1.6)}
.seek .bf,.seek .pl{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:4px}
.seek .bf{background:rgba(255,255,255,.3)} .seek .pl{background:#fff}
.seek .th{position:absolute;top:13px;left:0;width:14px;height:14px;margin:-7px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.5);transform:scale(0);transition:transform .35s var(--spring)}
.seek:hover .th,.seek.drag .th{transform:scale(1)}
.seek .tip{position:absolute;bottom:26px;left:0;transform:translateX(-50%) translateY(4px);padding:5px 9px;border-radius:999px;background:rgba(20,20,20,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font:500 11.5px/1 var(--mono);color:#fff;opacity:0;transition:opacity .2s,transform .3s var(--spring);pointer-events:none;white-space:nowrap}
.seek:hover .tip,.seek.drag .tip{opacity:1;transform:translateX(-50%)}
.p-big{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px;border-radius:50%;display:grid;place-items:center;background:rgba(20,20,20,.55);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);color:#fff;transition:opacity .3s var(--ease),transform .5s var(--spring)}
.p-big .ic{width:34px;height:34px}
.p-big:hover{transform:scale(1.07)} .p-big:active{transform:scale(.92)}
.player.playing .p-big,.player.wait .p-big,.player.msg .p-big{opacity:0;transform:scale(.6);pointer-events:none}
.p-spin{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;animation:spin .8s linear infinite;opacity:0;transition:opacity .3s .15s;pointer-events:none}
.player.wait:not(.msg) .p-spin{opacity:1}
.p-msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);max-width:min(440px,84%);padding:16px 22px;border-radius:24px;background:rgba(20,20,20,.7);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:#fff;text-align:center;font-weight:550;line-height:1.35;opacity:0;pointer-events:none;transition:opacity .3s var(--ease),transform .5s var(--spring)}
.player.msg .p-msg{opacity:1;transform:translate(-50%,-50%)}
.p-msg .bar{height:4px;border-radius:4px;background:rgba(255,255,255,.2);margin-top:12px;overflow:hidden}
.p-msg .bar i{display:block;height:100%;width:0;background:#fff;transition:width .6s var(--ease)}
.p-note{position:absolute;left:50%;bottom:86px;transform:translateX(-50%) translateY(10px);max-width:86%;padding:9px 16px;border-radius:999px;background:rgba(20,20,20,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:#fff;font-size:13px;font-weight:550;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s var(--ease),transform .5s var(--spring)}
.p-note.in{opacity:1;transform:translateX(-50%)}
.p-unmute{position:absolute;left:50%;top:calc(64px + var(--sat));transform:translateX(-50%);animation:pop .5s var(--spring) both;z-index:3}
.p-stats{position:absolute;left:calc(14px + var(--sal));top:64px;padding:10px 13px;border-radius:14px;background:rgba(10,10,10,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font:500 11px/1.6 var(--mono);color:rgba(255,255,255,.9);white-space:pre;pointer-events:none;animation:pop .35s var(--spring) both}
.p-rip{position:absolute;top:50%;width:92px;height:92px;margin-top:-46px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);color:#fff;font:600 13px/1 var(--mono);opacity:0;pointer-events:none}
.p-rip.l{left:12%} .p-rip.r{right:12%}
.p-rip.go{animation:ripple .6s var(--ease)}
.p-menu{position:absolute;right:calc(14px + var(--sar));bottom:70px;width:268px;max-height:calc(100% - 100px);overflow-y:auto;padding:6px;border-radius:22px;background:rgba(22,22,22,.78);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.13),var(--sh-l);color:#fff;opacity:0;transform:translateY(10px) scale(.94);transform-origin:100% 100%;pointer-events:none;transition:opacity .25s var(--ease),transform .45s var(--spring);z-index:5}
.p-menu.in{opacity:1;transform:none;pointer-events:auto}
.p-menu .mi{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:6px 12px;border-radius:15px;font-size:14px;font-weight:550;text-align:left;transition:background-color .2s}
.p-menu .mi:hover{background:rgba(255,255,255,.11)}
.p-menu .mi .val{margin-left:auto;color:rgba(255,255,255,.6);font-size:13px;display:flex;align-items:center;gap:2px}
.p-menu .mi .chk{margin-left:auto;opacity:0;transform:scale(.5);transition:opacity .2s,transform .4s var(--spring)}
.p-menu .mi.on .chk{opacity:1;transform:none}
.p-menu .mh{display:flex;align-items:center;gap:6px;padding:4px 6px 8px;font-weight:650;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:5px}
.p-menu .pg{animation:pgIn .35s var(--ease) both}
.p-menu .zoom{display:flex;align-items:center;gap:8px;padding:10px 12px}
.p-menu .zoom input{flex:1;--v:33%}
.p-menu .zoom input::-webkit-slider-runnable-track{background:linear-gradient(to right,#fff var(--v),rgba(255,255,255,.25) var(--v))}
.p-react{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2}
.p-react span{position:absolute;bottom:70px;font-size:38px;line-height:1;animation:floatUp 3.2s cubic-bezier(.2,.6,.3,1) forwards;will-change:transform,opacity}
.p-react span small{display:block;font:600 10px/1 var(--font);text-align:center;color:#fff;margin-top:3px;text-shadow:0 1px 4px #000}
.p-bubbles{position:absolute;left:calc(16px + var(--sal));bottom:92px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none;z-index:2;max-width:min(360px,70%)}
.p-bubble{padding:8px 13px;border-radius:18px;background:rgba(20,20,20,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#fff;font-size:13.5px;line-height:1.3;animation:bubble 5.5s var(--ease) both}
.p-bubble b{font-weight:650;margin-right:6px}
body.pfs .player.fs{position:fixed;inset:0;z-index:600;width:100vw;height:100dvh;padding-top:0}
body.pfs .player.fs .p-top{padding-top:calc(12px + var(--sat))}
body.pfs .player.fs .p-bot{padding-bottom:calc(10px + var(--sab))}

/* ───────── Комната просмотра ───────── */
#room{position:fixed;inset:0;z-index:500;background:#000;display:grid;grid-template-columns:minmax(0,1fr) 372px;padding-top:var(--sat);opacity:0;transform:scale(1.02);transition:opacity .4s var(--ease),transform .5s var(--ease)}
#room.in{opacity:1;transform:none}
#room.solo{grid-template-columns:minmax(0,1fr)}
#stage{position:relative;min-width:0;min-height:0}
#rpanel{display:flex;flex-direction:column;min-height:0;background:var(--s1);border-left:1px solid var(--line);padding-bottom:var(--sab)}
.rp-head{display:flex;align-items:center;gap:8px;padding:12px 12px 8px;flex:none}
.rp-body{flex:1;min-height:0;position:relative}
.rp-pane{position:absolute;inset:0;overflow-y:auto;padding:6px 12px 10px;display:flex;flex-direction:column;gap:2px;animation:pgIn .35s var(--ease) both}
.chat-empty{margin:auto;text-align:center;color:var(--fg3);font-size:13.5px;padding:20px}
.msg{display:flex;gap:9px;padding:5px 4px;animation:msgIn .4s var(--spring) both}
.msg .who{font-weight:650;font-size:12.5px;display:flex;align-items:baseline;gap:7px}
.msg .at{font:500 10px/1 var(--mono);color:var(--fg3);padding:3px 6px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;transition:color .2s,box-shadow .2s}
.msg .at:hover{color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.msg .tx{font-size:14px;line-height:1.38;overflow-wrap:anywhere;color:var(--fg)}
.msg.sys{justify-content:center;color:var(--fg3);font-size:12px;padding:6px}
.rp-foot{flex:none;padding:8px 12px 12px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.reacts{display:flex;justify-content:space-between;gap:2px}
.reacts button{flex:1;height:36px;border-radius:12px;font-size:19px;line-height:1;transition:transform .35s var(--spring),background-color .2s}
.reacts button:hover{background:var(--pill);transform:translateY(-3px) scale(1.15)} .reacts button:active{transform:scale(.8)}
.chat-in{display:flex;gap:8px;align-items:center}
.chat-in .field{flex:1;height:44px;padding:0 6px 0 16px}
.chat-in .field input{font-size:15px}
.viewer{display:flex;align-items:center;gap:11px;padding:8px 6px;border-radius:var(--r-m);animation:rise .4s var(--ease) both}
.viewer .st{font-size:12px;color:var(--fg2);display:flex;align-items:center;gap:6px}
.viewer input[type=range]{width:84px}
.voicebox{margin-top:auto;padding:14px;border-radius:var(--r-l);background:var(--glass2);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:10px}

/* ───────── Музыка: мини-плеер и «Сейчас играет» ───────── */
#mini{position:fixed;z-index:300;left:calc(var(--side) + 20px);right:20px;bottom:calc(16px + var(--sab));height:64px;display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;border-radius:999px;background:var(--glass);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);box-shadow:inset 0 0 0 1px var(--line2),var(--sh-l);max-width:760px;margin:0 auto;transform:translateY(140%);opacity:0;transition:transform .6s var(--spring),opacity .3s var(--ease);overflow:hidden;cursor:pointer}
#mini.in{transform:none;opacity:1}
#mini .cover{border-radius:50%;width:48px;height:48px}
#mini.playing .cover img{animation:spin 14s linear infinite}
#mini .prog{position:absolute;left:0;bottom:0;height:2.5px;background:var(--fg);width:0;transition:width .5s linear}
#np{position:fixed;inset:0;z-index:520;display:grid;grid-template-columns:minmax(0,1fr) 400px;color:#fff;background:#050505;overflow:hidden;transform:translateY(100%);transition:transform .6s var(--ease);padding-top:var(--sat)}
#np.in{transform:none}
.np-bg{position:absolute;inset:-12%;background-size:cover;background-position:center;filter:grayscale(1) blur(64px) brightness(.5) contrast(1.15);transform:scale(1.15);opacity:0;transition:opacity 1.2s var(--ease);animation:drift 30s ease-in-out infinite alternate;pointer-events:none}
.np-bg.in{opacity:1}
.np-grain{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%,transparent 40%,rgba(0,0,0,.6));pointer-events:none}
.np-main{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vh,30px);padding:70px 32px calc(32px + var(--sab));min-height:0;min-width:0}
.np-close{position:absolute;left:calc(16px + var(--sal));top:14px}
.np-leave{position:absolute;right:16px;top:14px}
.np-cover{position:relative;width:min(44vh,78vw,440px);aspect-ratio:1;border-radius:32px;overflow:hidden;background:#161616;box-shadow:0 50px 120px -30px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.1);display:grid;place-items:center;color:rgba(255,255,255,.3);transition:transform .9s var(--spring);transform:scale(.88)}
#np.playing .np-cover{transform:none}
.np-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .6s var(--ease)}
.np-title{text-align:center;max-width:min(560px,100%)}
.np-title h2{font-size:clamp(22px,3.4vh,32px)}
.np-title p{margin:6px 0 0;color:rgba(255,255,255,.62);font-size:15.5px}
.np-seek{width:min(520px,100%)}
.np-seek .times{display:flex;justify-content:space-between;font:500 11.5px/1 var(--mono);color:rgba(255,255,255,.6);margin-top:2px}
.np-ctl{display:flex;align-items:center;gap:14px}
.np-ctl .pb{width:54px;height:54px} .np-ctl .pb .ic{width:26px;height:26px}
.np-ctl .pb.main{width:76px;height:76px;background:#fff;color:#000} .np-ctl .pb.main .ic{width:32px;height:32px}
.np-side{position:relative;display:flex;flex-direction:column;min-height:0;background:rgba(10,10,10,.5);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-left:1px solid rgba(255,255,255,.08);padding-bottom:var(--sab)}
.qitem{display:flex;align-items:center;gap:11px;padding:7px 6px;border-radius:16px;background:transparent;transition:background-color .2s,transform .3s var(--ease),box-shadow .3s;touch-action:pan-y}
.qitem:hover{background:var(--glass2)}
.qitem.cur{background:var(--pill)}
.qitem.drag{z-index:5;background:var(--s3);box-shadow:var(--sh-l);transition:none;cursor:grabbing}
.qitem .grip{color:var(--fg3);cursor:grab;touch-action:none;padding:8px 2px}
.qitem .cover{width:42px;height:42px;border-radius:10px}

/* ───────── Загрузка: лист «Добавить» ───────── */
.dropzone{display:flex;flex-direction:column;align-items:center;gap:10px;padding:34px 20px;border-radius:var(--r-l);border:1.5px dashed var(--line2);text-align:center;transition:background-color .25s,border-color .25s,transform .4s var(--spring);cursor:pointer}
.dropzone:hover{background:var(--glass2);border-color:var(--fg3)}
.probe{display:flex;flex-direction:column;gap:14px;animation:rise .45s var(--ease) both}
.probe-h{display:flex;gap:14px;align-items:flex-start}
.probe-h .th{position:relative;width:148px;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:var(--s3);flex:none;display:grid;place-items:center;color:var(--fg3)}
.probe-h .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.quals{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.qual{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:12px 14px;border-radius:18px;background:var(--glass2);box-shadow:inset 0 0 0 1px var(--line);text-align:left;transition:transform .4s var(--spring),box-shadow .25s,background-color .25s,color .25s}
.qual:active{transform:scale(.95)}
.qual b{font:700 16px/1 var(--display);letter-spacing:-.02em}
.qual span{font:500 11px/1 var(--mono);color:var(--fg2)}
.qual.on{background:var(--inv);color:var(--inv-fg);box-shadow:var(--sh-s)} .qual.on span{color:inherit;opacity:.65}
.entry{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:16px;text-align:left;transition:background-color .2s}
.entry:hover{background:var(--pill)}

/* ───────── Анимации ───────── */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes vanish{to{opacity:0;transform:scale(.92)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes shimmer{to{transform:translateX(100%)}}
@keyframes toastIn{from{opacity:0;transform:translateY(-18px) scale(.9)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-12px) scale(.94)}}
@keyframes eq{0%,100%{height:3px}50%{height:10px}}
@keyframes talk{50%{box-shadow:0 0 0 2px var(--bg),0 0 0 6px var(--fg3)}}
@keyframes drift{from{transform:translate(-2%,-2%) scale(1.15)}to{transform:translate(3%,2%) scale(1.3)}}
@keyframes floatUp{0%{opacity:0;transform:translateY(20px) scale(.4)}12%{opacity:1;transform:translateY(-10px) scale(1.15)}100%{opacity:0;transform:translate(var(--dx,0),-62cqh) scale(.9) rotate(var(--rot,0deg))}}
@keyframes bubble{0%{opacity:0;transform:translateY(10px) scale(.92)}7%{opacity:1;transform:none}88%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(.97)}}
@keyframes pgIn{from{opacity:0;transform:translateX(10px)}}
@keyframes ripple{0%{opacity:0;transform:scale(.6)}30%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}

/* ───────── Адаптив: телефон — нижняя навигация ───────── */
@media (max-width:860px){
  :root{--pad:14px;--gap:12px;--tabh:76px}
  #app{grid-template-columns:minmax(0,1fr)}
  #side{display:none}
  #top{padding:10px var(--pad) 6px;min-height:58px}
  #top h1{font-size:25px}
  #top .logo{display:block}
  #tab{display:flex;position:fixed;z-index:310;left:50%;bottom:calc(10px + var(--sab));transform:translateX(-50%);padding:5px;border-radius:999px;background:var(--glass);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);box-shadow:inset 0 0 0 1px var(--line2),var(--sh-l);isolation:isolate;transition:transform .5s var(--ease),opacity .3s}
  #tab>button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:74px;height:52px;border-radius:999px;font-size:10.5px;font-weight:600;color:var(--fg2);transition:color .3s var(--ease)}
  #tab>button.on{color:var(--inv-fg)}
  #tab>button .ic{width:21px;height:21px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:16px var(--gap)}
  .card-media{border-radius:20px}
  .card-title{font-size:13.5px} .card-meta{font-size:11px}
  .card-play{display:none}
  .item .acts{opacity:1}
  .live-strip{display:flex;gap:10px;overflow-x:auto;margin:0 calc(var(--pad)*-1) 16px;padding:2px var(--pad);scrollbar-width:none}
  .live-strip::-webkit-scrollbar{display:none}
  .live-strip .live-item{width:auto;min-width:230px;max-width:80vw;flex:none}
  .live-strip:empty{display:none}
  .sheet{left:0;right:0;top:auto;bottom:0;width:100%;max-height:calc(100% - 40px - var(--sat));border-radius:var(--r-xl) var(--r-xl) 0 0;transform:translateY(102%);opacity:1;transition:transform .55s var(--ease);padding-bottom:var(--sab)}
  .sheet.wide{width:100%}
  .sheet.in{transform:none}
  .grab{display:block;width:40px;height:4.5px;border-radius:4px;background:var(--line2);margin:10px auto -6px;flex:none}
  .sheet-h{padding:18px 16px 4px 20px} .sheet-b{padding:12px 18px 22px}
  #mini{left:10px;right:10px;bottom:calc(76px + var(--sab))}
  #room{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  #room.solo{grid-template-rows:minmax(0,1fr)}
  #room:not(.solo) #stage{aspect-ratio:16/9;max-height:46vh}
  #rpanel{border-left:0;border-top:1px solid var(--line)}
  #np{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
  .np-side{position:absolute;inset:0;z-index:4;background:rgba(8,8,8,.86);transform:translateY(100%);transition:transform .55s var(--ease);padding-top:calc(var(--sat) + 6px)}
  #np.side .np-side{transform:none}
  .np-main{padding:64px 22px calc(26px + var(--sab))}
  .np-cover{width:min(40vh,82vw)}
  .p-vol input{display:none}
  .p-menu{right:10px;left:10px;width:auto;bottom:64px}
  .pb{width:40px;height:40px}
  .probe-h .th{width:112px}
  .hide-m{display:none!important}
}
@media (min-width:861px){ .hide-d{display:none!important} #top .logo{display:none} }
.only-land{display:none!important}
/* Телефон боком: видео на весь экран, чат выезжает поверх */
@media (max-width:960px) and (orientation:landscape) and (max-height:540px){
  #room{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
  #room:not(.solo) #stage{aspect-ratio:auto;max-height:none}
  #rpanel{position:absolute;right:0;top:0;bottom:0;width:min(340px,76vw);z-index:6;transform:translateX(102%);transition:transform .5s var(--ease);border-left:1px solid var(--line);border-top:0;padding-top:var(--sat)}
  #room.drawer #rpanel{transform:none}
  .pb.only-land{display:grid!important} .btn.only-land{display:inline-flex!important}
}
@media (max-width:360px){ #tab>button{width:66px} .grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (hover:none){ .card.ready:hover .card-media{transform:none;box-shadow:inset 0 0 0 1px var(--line)} .p-vol{display:none} .item .acts{opacity:1} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

async function api(path, o = {}) {

  try { j = await r.json(); } catch {}
  if (!r.ok) {
    const err = new Error((j && j.error) || `Ошибка ${r.status}`);
    err.status = r.status; err.data = j || {};
    if (r.status === 401 && S.me && !o.quiet) loggedOut();

  }

}

/* ═══════════ Синхронизация с комнатой ═══════════ */
/**
 * Состояние комнаты (играет/пауза, позиция, момент времени) хранит сервер. Здесь мы подгоняем под него свой плеер:
 * небольшое расхождение подтягиваем скоростью, большое — перемоткой. Если у нас идёт подгрузка — сообщаем, комната подождёт.
 */
function makeSync(el, hooks) {
  let bufOn = false, bufSince = 0, lastSeek = 0, timer = null, drift = 0, force = false;
  const run0 = s => s.playing && !s.hold.length;
  const report = on => { if (bufOn !== on) { bufOn = on; Sock.send({ t: 'buf', on }); } };
  function tick() {
    const s = Room.st;
    if (!s || !s.mediaId) return report(false);
    if ((hooks.blocked && hooks.blocked()) || !(el.currentSrc || el.src)) return report(false);
    const t = performance.now(), dur = el.duration || 0;
    const tgt = Room.pos(), nearEnd = dur && tgt >= dur - 0.4;
    // подгрузка: даём 0,7 с форы, чтобы не дёргать комнату по мелочам
    const starving = !nearEnd && (el.readyState < 3 || el.seeking);
    if (starving && s.playing) { if (!bufSince) bufSince = t; if (t - bufSince > 700) report(true); }
    else { bufSince = 0; report(false); }
    if (el.readyState < 1) return;
    const run = s.playing && !s.hold.length;
    const want = dur ? Math.min(tgt, Math.max(0, dur - 0.05)) : tgt;
    drift = want - el.currentTime;
    // кто-то перемотал: прыгаем сразу, даже если расхождение небольшое
    if (force) { force = false; if (Math.abs(drift) > 0.05 && !el.seeking) { try { el.currentTime = want + (run0(s) ? 0.05 : 0); } catch {} lastSeek = t; drift = 0; } }
    const iHold = bufOn && s.hold.includes(S.me.id);
    if (!run && !iHold) {
      if (!el.paused) el.pause();
      if (Math.abs(drift) > 0.15 && !el.seeking) { try { el.currentTime = want; } catch {} }
      if (el.playbackRate !== s.rate) el.playbackRate = s.rate;
      return;
    }
    if (Math.abs(drift) > (iHold ? 0.6 : 1.2)) {
      if (!el.seeking && t - lastSeek > 1200) { try { el.currentTime = want + (run ? 0.12 : 0); } catch {} lastSeek = t; }
      if (el.playbackRate !== s.rate) el.playbackRate = s.rate;
    } else if (run && Math.abs(drift) > 0.08) el.playbackRate = s.rate * (1 + clamp(drift * 0.4, -0.1, 0.1));
    else if (el.playbackRate !== s.rate) el.playbackRate = s.rate;
    if (el.paused && !el.ended && !nearEnd) hooks.play();

  timer = setInterval(tick, 250);
  return { kick: tick, jump() { force = true; tick(); }, stop() { clearInterval(timer); bufOn = false; }, drift: () => drift.toFixed(2) };
}

/* ═══════════ Комната ═══════════ */
const Room = {
  id: null, kind: null, st: null, chat: [], player: null, sync: null, soloOn: false, after: null, offBack: null,
  pos() {
    const s = this.st;
    if (!s) return 0;
    const p = s.playing && !s.hold.length ? s.pos + (srvNow() - s.at) / 1000 * s.rate : s.pos;
    const d = S.media.get(s.mediaId)?.duration || 0;
    return d ? clamp(p, 0, d) : Math.max(0, p);
  },
  need() { if (Sock.open) return true; toast('Нет связи с сервером — переподключаюсь…', { icon: 'warn' }); return false; },
  open(mediaId) { if (this.need()) { if (this.soloOn) this.endSolo(); Sock.send({ t: 'open', mediaId }); } },
  join(id) {
    if (this.id === id) { if (this.kind === 'music') Music.openNP(); return; }
    if (this.need()) { if (this.soloOn) this.endSolo(); Sock.send({ t: 'join', roomId: id }); }
  },
  joined(st, chat) {
    if (this.id && this.id !== st.id) this.teardown();
    const fresh = this.id !== st.id;
    this.id = st.id; this.kind = st.kind; this.st = st; this.chat = chat || [];
    if (st.kind === 'video') { if (fresh) this.buildVideo(); this.applyVideo(st); }
    else Music.joined(st, fresh);
    Panel.drawChat(); Panel.drawPeople();
    Voice.syncMembers(st.members);
    const f = this.after; this.after = null;
    if (f) f();
  },
  state(st) {
    if (!this.id || st.id !== this.id) return;
    const prev = this.st;
    this.st = st;
    this.announce(st);
    if (st.kind === 'video') this.applyVideo(st); else Music.apply(st, prev);
    if (st.act === 'seek' && this.sync) this.sync.jump();
    Panel.drawPeople();
    Voice.syncMembers(st.members);
  },
  announce(st) {
    if (!st.by || st.by === S.me.id) return;
    const n = userName(st.by);
    const t = { play: `${n} включил(а) воспроизведение`, pause: `${n} поставил(а) на паузу`, seek: `${n} перемотал(а) на ${fmtTime(st.pos)}`,
      rate: `${n} изменил(а) скорость: ${st.rate}×`, media: `${n} сменил(а) фильм`, join: `${n} теперь с нами`, leave: `${n} вышел(а)`,
      qadd: `${n} добавил(а) в очередь`, qplay: `${n} включил(а) трек`, qnext: `${n} переключил(а) трек`, qprev: `${n} переключил(а) трек`,
      qjump: `${n} переключил(а) трек`, qclear: `${n} очистил(а) очередь` }[st.act];
    if (t) this.note(t);
  },
  note(t) { if (this.kind === 'video' && this.player) this.player.note(t); else toast(t, { ms: 2600 }); },
  buildVideo() {
    const el = $('#room');
    el.hidden = false; el.classList.remove('solo', 'drawer');
    const stage = h('div#stage'), panel = h('div#rpanel');
    el.replaceChildren(stage, panel);
    const p = this.player = new Player(stage, {
      remote: (a, val) => Sock.send(a === 'seek' ? { t: 'ctl', a, pos: val } : a === 'rate' ? { t: 'ctl', a, rate: val } : { t: 'ctl', a }),
      isPlaying: () => !!(this.st && this.st.playing),
      time: () => this.pos(),
      rate: () => (this.st ? this.st.rate : 1),
      drift: () => (this.sync ? this.sync.drift() : '0'),
      onBack: () => this.leave(),
    });
    p.subLine = () => { const n = this.st ? new Set(this.st.members.map(m => m.uid)).size : 1; return `${n} ${plural(n, 'зритель', 'зрителя', 'зрителей')} · смотрим вместе`; };
    const B = (icon, title, fn, cls) => h('button.pb', { type: 'button', title, 'aria-label': title, cls, onclick: e => { e.stopPropagation(); fn(e); } }, ic(icon));
    add(p.topR,
      B('chat', 'Чат', () => { el.classList.toggle('drawer'); }, 'only-land'),
      B('plane', 'Позвать друзей', () => inviteSheet()),
      owner() && B('swap', 'Сменить фильм', () => pickFilmSheet()),
      owner() && B('door', 'Закрыть комнату', () => confirmSheet('Закрыть комнату?', 'Просмотр закончится у всех, кто сейчас внутри.', 'Закрыть', async () => { Sock.send({ t: 'close' }); }, true)));

  solo(m) {

    const el = $('#room');

  endSolo() { this.soloOn = false; this.hideVideo(); },

    const r = await api('/api/upload/init', { method: 'POST', body: { name: file.name, size: file.size, kind } });
    if (this.byMedia.has(r.mediaId)) return;
    const bits = Uint8Array.from(atob(r.bits), c => c.charCodeAt(0));
    const it = { file, id: r.id, mediaId: r.mediaId, chunk: r.chunk, total: r.total, done: new Set(), inflight: new Map(), sent: 0, speed: 0, samples: [], fails: 0, low: 0, dead: false, paused: false,
      progress() { let n = this.sent; for (const x of this.inflight.values()) n += x.loaded; return clamp(n / this.file.size, 0, 1); },
      speedText() { if (this.paused) return 'нет связи — жду'; if (!this.speed) return ''; const left = this.file.size * (1 - this.progress()); return `${fmtSize(this.speed)}/с · ещё ${fmtEta(left / this.speed)}`; } };
    for (let i = 0; i < r.total; i++) if (bits[i >> 3] & (1 << (i & 7))) { it.done.add(i); it.sent += this.size(it, i); }
    this.byMedia.set(r.mediaId, it);
    if (!S.media.has(r.mediaId)) await loadMedia(); else if (V.upload) V.upload(r.mediaId);
    this.pump(it);
    if (!this.timer) this.timer = setInterval(() => this.tick(), 500);
  },
  size(it, i) { return Math.min(it.chunk, it.file.size - i * it.chunk); },
  pump(it) {
    if (it.dead) return;
    while (it.inflight.size < this.par) {
      while (it.done.has(it.low)) it.low++;
      let i = -1;
      for (let k = it.low; k < it.total; k++) if (!it.done.has(k) && !it.inflight.has(k)) { i = k; break; }
      if (i < 0) break;
      this.send(it, i);
    }
    if (!it.inflight.size && it.done.size >= it.total) this.finish(it);

  send(it, i) {

    xhr.upload.onprogress = e => { rec.loaded = Math.min(size, e.loaded); };

  },
  fail(it, msg) {

  },

    } catch (e) {

      if (e.data && e.data.missing) { for (const i of e.data.missing) { if (it.done.delete(i)) it.sent -= this.size(it, i); } it.low = 0; this.pump(it); }

  forget(mediaId) { this.cancel(mediaId); },
  stopAll() { for (const id of [...this.byMedia.keys()]) this.cancel(id); },
  /* скорость сглаживаем: окно в несколько секунд плюс экспоненциальное среднее — без скачков 30 МБ/с → 100 КБ/с */
  tick() {

  },

function resizeAvatar(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(img.width, img.height), c = h('canvas', { width: 256, height: 256 });
      c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 256, 256);
      URL.revokeObjectURL(url);
      c.toBlob(b => (b ? res(b) : rej(new Error('Не удалось обработать картинку'))), 'image/jpeg', 0.86);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Это не похоже на картинку')); };
    img.src = url;
  });
}

  // оформление
  const look = h('div.panel', h('h3', 'Оформление'),
    setrow('half', 'Тема', 'Авто — как в системе' + (TG.app ? ' (в Telegram — как в Telegram)' : ''),
      pillbar([{ v: 'auto', label: 'Авто' }, { v: 'dark', label: 'Тёмная' }, { v: 'light', label: 'Светлая' }], LS.get('theme', 'auto'), v => { LS.set('theme', v); applyTheme(); }, 'soft')));
  if (TG.app) {
    const sw = h('button.switch', { type: 'button', role: 'switch', 'aria-label': 'На весь экран', cls: LS.get('tgfs', true) ? 'on' : '', onclick: () => {
      const on = !LS.get('tgfs', true); LS.set('tgfs', on); sw.classList.toggle('on', on);
      try { if (on) tgFullscreen(); else TG.app.exitFullscreen(); } catch {}
    } });
    look.append(setrow('fs', 'На весь экран в Telegram', 'Приложение разворачивается при запуске — на телефоне и на компьютере', sw));
  }
  // безопасность
  const cur = field('lock', { type: 'password', placeholder: 'Текущий пароль', autocomplete: 'current-password', maxlength: 200 });
  const nxt = field('key', { type: 'password', placeholder: 'Новый пароль (от 8 символов)', autocomplete: 'new-password', maxlength: 200 });
  const savePw = h('button.btn.wide', { type: 'submit' }, 'Сменить пароль');
  const sec = h('div.panel', h('h3', 'Безопасность'), h('p.hint', { style: 'margin:0 0 12px' }, 'После смены пароля все остальные устройства выйдут из аккаунта.'),
    h('form', { style: 'display:flex;flex-direction:column;gap:8px', onsubmit: async e => {
      e.preventDefault();
      if (!cur.input.value || !nxt.input.value) return;
      savePw.classList.add('busy');
      try { await api('/api/me/password', { method: 'POST', body: { current: cur.input.value, next: nxt.input.value } }); cur.input.value = nxt.input.value = ''; toast('Пароль изменён', { icon: 'check' }); }
      catch (er) { toast(er.message, { icon: 'warn', ms: 5000 }); }
      savePw.classList.remove('busy');
    } }, h('input', { type: 'text', autocomplete: 'username', value: me.login, hidden: true }), cur.el, nxt.el, savePw),
    h('div.row', { style: 'margin-top:14px;flex-wrap:wrap' },
      h('button.btn.sm.line', { type: 'button', onclick: async () => { try { await api('/api/auth/logout', { method: 'POST', body: {} }); } catch {} bye(); } }, ic('exit', 's'), 'Выйти'),
      h('button.btn.sm.line', { type: 'button', onclick: () => confirmSheet('Выйти на всех устройствах?', 'Сессии закроются везде, включая это устройство. Войти снова можно по паролю или через Telegram.', 'Выйти везде', async () => { await api('/api/auth/logout-all', { method: 'POST', body: {} }); bye(); }) }, ic('lock', 's'), 'Выйти на всех устройствах')));
  function bye() { S.me = null; Sock.close(); Room.reset(); Up.stopAll(); $('#app').hidden = true; showGate('login'); }
  const col1 = h('div.col', { style: 'gap:14px' }, profile, look), col2 = h('div.col', { style: 'gap:14px' }, sec);
  view.append(h('div.cols', col1, col2));
  if (!owner()) return;
  // сервер (только владелец)
  const srv = h('div.panel', h('h3', 'Сервер'), h('div.skel.line', { style: 'width:60%;margin-top:12px' }));
  col2.append(srv);
  (async function drawSrv() {
    let r;
    try { r = await api('/api/settings'); } catch (e) { srv.replaceChildren(h('h3', 'Сервер'), h('p.hint', e.message)); return; }
    const d = r.disk, other = Math.max(0, d.total - d.free - d.used);
    const fm = h('button.switch', { type: 'button', role: 'switch', 'aria-label': 'Друзья могут добавлять музыку', cls: r.friendsMusic ? 'on' : '', onclick: async () => {
      const on = !fm.classList.contains('on'); fm.classList.toggle('on', on);
      try { await api('/api/settings', { method: 'PATCH', body: { friendsMusic: on } }); } catch (e) { fm.classList.toggle('on', !on); toast(e.message, { icon: 'warn' }); }
    } });
    const upd = h('button.btn.sm', { type: 'button', onclick: async () => {
      upd.classList.add('busy');
      try { const x = await api('/api/settings/ytdlp-update', { method: 'POST', body: {} }); toast(x.ok ? `yt-dlp ${x.version}` : 'yt-dlp не найден на сервере', { icon: x.ok ? 'check' : 'warn' }); drawSrv(); }
      catch (e) { toast(e.message, { icon: 'warn' }); upd.classList.remove('busy'); }
    } }, ic('refresh', 's'), 'Обновить');
    const ck = h('div.row', { style: 'gap:6px' },
      h('button.btn.sm', { type: 'button', onclick: async () => {
        const [f] = await pickFiles('.txt,text/plain', false);
        if (!f) return;
        try { const x = await api('/api/settings/cookies', { method: 'POST', raw: await f.arrayBuffer() }); toast(`cookies.txt загружен: ${x.count} ${plural(x.count, 'запись', 'записи', 'записей')}`, { icon: 'check' }); drawSrv(); }
        catch (e) { toast(e.message, { icon: 'warn', ms: 6000 }); }
      } }, ic('up', 's'), r.cookies ? 'Заменить' : 'Загрузить'),
      r.cookies && h('button.btn.icon.sm.ghost', { type: 'button', 'aria-label': 'Удалить cookies.txt', onclick: async () => { try { await api('/api/settings/cookies', { method: 'DELETE' }); drawSrv(); } catch {} } }, ic('trash', 's')));
    srv.replaceChildren(h('h3', 'Сервер'),
      h('div', { style: 'margin:12px 0 4px' }, h('div.meter', h('i', { style: `width:${d.total ? d.used / d.total * 100 : 0}%` }), h('i', { style: `width:${d.total ? other / d.total * 100 : 0}%` })),
        h('div.row', { style: 'justify-content:space-between;margin-top:8px;font-size:12.5px' }, h('span', h('b', fmtSize(d.used)), ' — библиотека'), h('span.dim', `свободно ${fmtSize(d.free)} из ${fmtSize(d.total)}`))),
      setrow('down', 'yt-dlp', r.ytdlp.ok ? `Версия ${r.ytdlp.version}. Обновляется сам при запуске и каждые 6 часов.` : 'Не найден на сервере — загрузка по ссылке не работает.', upd),
      setrow('film', 'ffmpeg', r.ffmpeg.ok ? `Версия ${r.ffmpeg.version}` : 'Не найден на сервере — обработка видео не работает.'),
      setrow('cookie', 'cookies.txt', r.cookies ? `Загружен ${new Date(r.cookies.at).toLocaleDateString('ru-RU')} · ${fmtSize(r.cookies.size)}. Передаётся yt-dlp, когда сайт просит вход.` : 'Нужен, если сайт просит войти или «подтвердить, что вы не бот». Экспортируй cookies из браузера в формате Netscape.', ck),
      setrow('note', 'Друзья могут добавлять музыку', 'Фильмы всегда загружает только владелец', fm),
      setrow('plane', 'Telegram-бот', r.bot ? `@${r.bot.username}${r.bot.mainApp ? ' · Main Mini App настроен' : ' · кнопка меню открывает кинозал'}` : 'Не подключён: добавь BOT_TOKEN в .env'));
  })();
};

/* ═══════════ Поехали ═══════════ */
if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) W.__pt = { S, Sock, Room, Music, Voice, Up, Panel, go };      // для отладки на своей машине
W.addEventListener('online', () => { if (S.me && !Sock.open) Sock.connect(); });
D.addEventListener('visibilitychange', () => { if (!D.hidden && S.me && !Sock.open) Sock.connect(); });
boot().catch(e => { console.error(e); $('#splash').classList.add('out'); toast('Не удалось запустить приложение: ' + e.message, { icon: 'warn', ms: 15000 }); });
})();
</script>
</body>
</html>
